  <!-- Right paw -->
  <ellipse cx="161" cy="205" rx="14" ry="10" fill="#e0f5fc" stroke="#2d3436" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left blush -->
  <ellipse cx="88" cy="148" rx="14" ry="9" fill="#ff9ff3" opacity="0.85"/>
  <line x1="82" y1="144" x2="88" y2="152" stroke="#2d3436" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="87" y1="144" x2="93" y2="152" stroke="#2d3436" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="92" y1="144" x2="98" y2="152" stroke="#2d3436" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Right blush -->
  <ellipse cx="168" cy="148" rx="14" ry="9" fill="#ff9ff3" opacity="0.85"/>
  <line x1="162" y1="144" x2="168" y2="152" stroke="#2d3436" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="167" y1="144" x2="173" y2="152" stroke="#2d3436" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="172" y1="144" x2="178" y2="152" stroke="#2d3436" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Left eye -->
  <circle cx="100" cy="128" r="13" fill="#2d3436"/>
  <circle cx="96" cy="124" r="5" fill="#ffffff"/>
  <circle cx="104" cy="132" r="2.5" fill="#ffffff"/>

  <!-- Right eye -->
  <circle cx="156" cy="128" r="13" fill="#2d3436"/>
