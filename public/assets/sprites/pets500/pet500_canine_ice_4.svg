  <path d="M 205 135 Q 210 128 205 125" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Body -->
  <path d="M 128 70
           C 175 70 195 100 195 140
           C 195 185 165 210 128 210
           C 91 210 61 185 61 140
           C 61 100 81 70 128 70 Z"
