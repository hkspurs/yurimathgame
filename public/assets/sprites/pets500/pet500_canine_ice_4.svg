<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Frost tail -->
  <path d="M 175 165 Q 205 155 215 135 Q 220 125 210 120 Q 195 125 185 145 Q 178 158 175 165 Z"
